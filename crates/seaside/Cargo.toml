[package]
name = "seaside"
version = "1.3.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.100"
directories = "6.0.0"
seaside-assembler = { version = "*", path = "../assembler" }
seaside-config = { version = "*", path = "../config" }
seaside-core = { version = "0.1.0", path = "../core" }
seaside-executable = { version = "*", path = "../executable" }
seaside-interpreter = { version = "*", path = "../interpreter" }
seaside-rich-error = { version = "0.2.0", path = "../rich-error" }
serde = "1.0.219"
toml = "1.0.3"

[dependencies.clap]
version = "4.5.56"
features = ["cargo", "derive"]

[dependencies.minimal-logging]
version = "0.5"
git = "https://github.com/RosieTheGhostie/minimal-logging.git"
features = ["full"]

[dependencies.seaside-disassembler]
version = "*"
path = "../disassembler"
features = ["full"]
