[package]
name = "seaside-core"
description = "Core functionality for seaside"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
num-derive = "0.4"
num-traits = "0.2"
seaside-service-group = { version = "0.1.0", path = "../service-group" }
serde = { version = "1.0.219", optional = true }
serde_repr = { version = "0.1.20", optional = true }
strum = { version = "0.27.2", features = ["derive"] }
take-exact = { version = "0.1.0", git = "https://github.com/RosieTheGhostie/take-exact" }
thiserror = "2.0.18"
validator = { version = "0.20.0", optional = true }

[features]
serde = ["dep:serde", "dep:serde_repr"]
validator = ["dep:validator"]

default = []
full = ["serde", "validator"]
