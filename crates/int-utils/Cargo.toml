[package]
name = "seaside-int-utils"
description = "A small set of integer utilities for seaside"
version = "0.4.0"
authors = ["RosieTheGhostie <rosetheghost.dev@gmail.com>"]
edition = "2024"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]
optional = true

[features]
byte-stream = ["endian"]
endian = []
sign-extend = []

default = []
full = ["byte-stream", "endian", "sign-extend"]
