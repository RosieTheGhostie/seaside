[package]
name = "seaside-config"
description = "Configuration support for seaside"
version = "1.3.0"                                          # must match the version of seaside
authors = ["RosieTheGhostie <rosetheghost.dev@gmail.com>"]
edition = "2024"

[dependencies]
anyhow = "1.0.98"
num-traits = "0.2.19"
seaside-error = { version = "*", path = "../error" }
seaside-type-aliases = { version = "*", path = "../type-aliases" }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
strum = { version = "0.27.1", features = ["derive"] }

[dependencies.seaside-address-range]
version = "*"
path = "../address-range"
features = ["seaside-int-utils", "serde"]

[dependencies.seaside-constants]
version = "*"
path = "../constants"
features = ["register", "seaside-int-utils", "serde", "services"]

[dependencies.seaside-int-utils]
version = "*"
path = "../int-utils"
features = ["all-zeroes", "endian", "serde"]
