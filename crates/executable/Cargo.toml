[package]
name = "seaside-executable"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = { version = "2.10.0", features = ["serde"] }
seaside-binary-format = { version = "0.1.0", path = "../binary-format" }
seaside-type-aliases = { version = "*", path = "../type-aliases" }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.18"
validator = { version = "0.20.0", features = ["derive"] }

[dependencies.seaside-address-range]
version = "*"
path = "../address-range"
features = ["serde"]

[dependencies.seaside-constants]
version = "*"
path = "../constants"
features = ["register", "serde", "services"]
