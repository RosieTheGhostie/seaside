[package]
name = "seaside-constants"
description = "Various constant and enum definitions for use in seaside"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
num-derive = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
serde = { version = "1.0.219", optional = true }
serde_repr = { version = "0.1.20", optional = true }
thiserror = { version = "2.0.18", optional = true }
validator = { version = "0.20.0", optional = true }

[dependencies.seaside-int-utils]
version = "*"
path = "../int-utils"
optional = true

[dependencies.seaside-service-group]
version = "*"
path = "../service-group"
optional = true

[dependencies.seaside-type-aliases]
version = "*"
path = "../type-aliases"
optional = true

[dependencies.strum]
version = "0.27.2"
features = ["derive"]
optional = true

[dependencies.take-exact]
version = "0.1.0"
git = "https://github.com/RosieTheGhostie/take-exact"
optional = true

[features]
instruction-format = ["opcodes"]
number-format = ["dep:num-derive", "dep:strum"]
opcodes = ["dep:num-derive", "dep:strum"]
register = [
  "dep:num-derive",
  "dep:num-traits",
  "dep:strum",
  "dep:take-exact",
  "dep:thiserror",
]
serde = ["dep:serde", "dep:serde_repr"]
services = [
  "dep:seaside-service-group",
  "dep:seaside-type-aliases",
  "serde?/derive",
  "dep:strum",
]
static-segment = ["dep:strum"]
unimplemented = []

default = []
full = [
  "instruction-format",
  "number-format",
  "opcodes",
  "register",
  "seaside-int-utils",
  "serde",
  "services",
  "static-segment",
  "unimplemented",
  "validator",
]
